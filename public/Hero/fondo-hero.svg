<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 400" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071735"/>
      <stop offset="1" stop-color="#0b2252"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b30f1a"/>
      <stop offset="1" stop-color="#ef1c25"/>
    </linearGradient>
    <linearGradient id="red2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7d0a14"/>
      <stop offset="1" stop-color="#c8121c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff9a2e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff7a00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#f5a623" fill-opacity="0.55"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotmask"><rect width="520" height="260" fill="url(#fade)"/></mask>
  </defs>

  <!-- base azul marino -->
  <rect width="1920" height="400" fill="url(#navy)"/>
  <!-- chevron sutil a la izquierda -->
  <polygon points="0,60 110,200 0,340" fill="#10285a" fill-opacity="0.7"/>
  <!-- puntos naranjas esquina inferior izquierda -->
  <g transform="translate(0,170)" mask="url(#dotmask)"><rect width="520" height="260" fill="url(#dots)"/></g>

  <!-- diagonales rojas -->
  <polygon points="1010,400 1500,0 1920,0 1920,400" fill="url(#red2)"/>
  <polygon points="1150,400 1640,0 1920,0 1920,400" fill="url(#red)"/>
  <polygon points="960,400 1040,400 1180,300" fill="#ff3b30" fill-opacity="0.9"/>
  <polygon points="1000,400 1100,400 1240,330" fill="#ffffff" fill-opacity="0.12"/>

  <!-- destello central -->
  <ellipse cx="1260" cy="290" rx="190" ry="120" fill="url(#glow)"/>
  <g fill="#ffd27a">
    <circle cx="1180" cy="250" r="2.4"/><circle cx="1215" cy="215" r="1.8"/>
    <circle cx="1290" cy="190" r="2.2"/><circle cx="1330" cy="240" r="1.6"/>
    <circle cx="1255" cy="160" r="1.5"/><circle cx="1360" cy="300" r="2"/>
    <circle cx="1140" cy="310" r="1.7"/><circle cx="1310" cy="130" r="1.4"/>
    <circle cx="1230" cy="340" r="2.2"/><circle cx="1400" cy="200" r="1.6"/>
  </g>

  <!-- confeti -->
  <g>
    <rect x="1020" y="70" width="38" height="12" fill="#f5a623" transform="rotate(35 1020 70)"/>
    <rect x="1075" y="210" width="26" height="9" fill="#f5a623" transform="rotate(-30 1075 210)"/>
    <rect x="1415" y="60" width="24" height="9" fill="#ffd27a" transform="rotate(50 1415 60)"/>
    <rect x="1530" y="320" width="30" height="9" fill="#f5a623" transform="rotate(-40 1530 320)"/>
    <rect x="1000" y="330" width="42" height="10" fill="#f5a623" transform="rotate(-25 1000 330)"/>
    <rect x="1490" y="150" width="20" height="8" fill="#ffd27a" transform="rotate(20 1490 150)"/>
    <rect x="1130" y="40" width="16" height="7" fill="#ffd27a" transform="rotate(-50 1130 40)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
