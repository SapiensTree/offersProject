      <stop offset="1" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd35a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd35a" stop-opacity="0"/>
    </radialGradient>
    <g id="flake" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none">
