<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1072" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#12b8d6"/>
      <stop offset="0.5" stop-color="#4fd6c0"/>
      <stop offset="1" stop-color="#ffe27a"/>
    </linearGradient>
    <linearGradient id="blobA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="blobB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd35a" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="0.45" stop-color="#ffc83a"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.32" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#7a1f3a" stop-opacity=".45"/>
    </radialGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="0.5" stop-color="#ff9ec7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff7aa8" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd35a"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7aa8"/>
      <stop offset="1" stop-color="#ffe0a0"/>
    </linearGradient>
    <clipPath id="ballclip"><circle r="120"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0a5a73" flood-opacity=".28"/>
    </filter>
    <g id="bub">
      <circle r="50" fill="url(#bubble)"/>
      <circle r="50" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
      <ellipse cx="-16" cy="-20" rx="12" ry="7" fill="#fff" fill-opacity=".85" transform="rotate(-35 -16 -20)"/>
    </g>
  </defs>

  <rect width="1920" height="1072" fill="url(#bg)"/>

  <!-- formas orgánicas -->
  <path d="M0 0H640C640 120 540 190 400 215C250 242 150 300 80 390C40 440 0 470 0 470Z" fill="url(#blobA)"/>
  <path d="M1320 0H1920V330C1850 290 1800 190 1650 170C1500 150 1330 130 1320 0Z" fill="url(#blobB)"/>
  <path d="M0 790C150 760 310 830 430 900C540 965 560 1040 470 1072H0Z" fill="url(#blobA)"/>
  <path d="M1920 760C1800 790 1700 860 1650 950C1620 1005 1650 1050 1700 1072H1920Z" fill="#fff" fill-opacity=".16"/>

  <!-- aros -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="300" cy="260" rx="64" ry="60" stroke="url(#ring1)" stroke-width="12" opacity=".9"/>
    <ellipse cx="420" cy="860" rx="108" ry="92" stroke="url(#ring2)" stroke-width="16" transform="rotate(-18 420 860)" opacity=".95"/>
    <ellipse cx="1500" cy="880" rx="70" ry="62" stroke="url(#ring1)" stroke-width="10" opacity=".8"/>
  </g>

  <!-- sol -->
  <g transform="translate(1640,290)" filter="url(#soft)">
    <g stroke="#ffb02e" stroke-width="22" stroke-linecap="round">
      <line x1="0" y1="-150" x2="0" y2="-118" transform="rotate(0)"/>
      <line x1="0" y1="-150" x2="0" y2="-118" transform="rotate(30)"/>
      <line x1="0" y1="-150" x2="0" y2="-118" transform="rotate(60)"/>
      <line x1="0" y1="-150" x2="0" y2="-118" transform="rotate(90)"/>
      <line x1="0" y1="-150" x2="0" y2="-118" transform="rotate(120)"/>
      <line x1="0" y1="-150" x2="0" y2="-118" transform="rotate(150)"/>
      <line x1="0" y1="-150" x2="0" y2="-118" transform="rotate(180)"/>
      <line x1="0" y1="-150" x2="0" y2="-118" transform="rotate(210)"/>
      <line x1="0" y1="-150" x2="0" y2="-118" transform="rotate(240)"/>
      <line x1="0" y1="-150" x2="0" y2="-118" transform="rotate(270)"/>
      <line x1="0" y1="-150" x2="0" y2="-118" transform="rotate(300)"/>
      <line x1="0" y1="-150" x2="0" y2="-118" transform="rotate(330)"/>
    </g>
    <circle r="95" fill="url(#sun)"/>
    <circle r="95" fill="url(#shine)"/>
  </g>

  <!-- pelota de playa -->
  <g transform="translate(280,560) rotate(-16)" filter="url(#soft)">
    <g clip-path="url(#ballclip)">
      <rect x="-120" y="-120" width="240" height="240" fill="#fff"/>
      <path d="M0 0L-120 -120H-40Z" fill="#ff5d73"/>
      <path d="M0 0L120 -120H40Z" fill="#ffc83a"/>
      <path d="M0 0L120 -40V40Z" fill="#ff5d73"/>
      <path d="M0 0L40 120H120Z" fill="#12b8d6"/>
      <path d="M0 0L-40 120H-120Z" fill="#ffc83a"/>
      <path d="M0 0L-120 40V-40Z" fill="#12b8d6"/>
      <circle r="120" fill="url(#shade)"/>
      <circle r="120" fill="url(#shine)"/>
    </g>
    <circle r="16" fill="#fff" stroke="#e8e8e8" stroke-width="3"/>
  </g>

  <!-- burbujas -->
  <use href="#bub" transform="translate(1790,520) scale(.8)"/>
  <use href="#bub" transform="translate(1850,260) scale(.35)"/>
  <use href="#bub" transform="translate(1720,720) scale(1.1)"/>
  <use href="#bub" transform="translate(1810,850) scale(.55)"/>
  <use href="#bub" transform="translate(1180,170) scale(.45)"/>
  <use href="#bub" transform="translate(120,150) scale(.6)"/>
  <use href="#bub" transform="translate(600,960) scale(.5)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
